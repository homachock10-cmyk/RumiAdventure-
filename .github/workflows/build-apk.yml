name: Build Rumi Adventure APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Inspect and extract game project
        run: |
         echo "=== FILES IN ZIP ==="
         unzip -l RumiAdventure-Updated-16bit.zip
         echo "=== EXTRACT ZIP ==="
         unzip -o RumiAdventure-Updated-16bit.zip -d source
         echo "=== EXTRACTED FILES ==="
         find source -maxdepth 4 -type f | head -200
         echo "=== GAME HTML ==="
         sed -n "1,260p" source/RumiAdventure2/index.html

      - name: Build Android APK
        run: gradle -p source/RumiAdventure2/android assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: RumiAdventure-APK
          path: source/RumiAdventure2/android/app/build/outputs/apk/debug/app-debug.apk
