name: Build Rumi Adventure APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Inspect and extract game project
        run: |
         echo "=== FILES IN ZIP ==="
         unzip -l RumiAdventure-Updated-16bit.zip
         echo "=== EXTRACT ZIP ==="
         unzip -o RumiAdventure-Updated-16bit.zip -d source
         echo "=== EXTRACTED FILES ==="
         find source -maxdepth 4 -type f | head -200
         echo "=== GAME HTML ==="
         sed -n "1,260p" source/RumiAdventure2/index.html

      - name: Apply first 16-bit upgrade
        run: python3 scripts/upgrade_16bit.py

      - name: Package updated source ZIP and build script
        run: |
          python3 -m py_compile scripts/upgrade_16bit.py
          mkdir -p source/RumiAdventure2/scripts dist
          cp scripts/upgrade_16bit.py source/RumiAdventure2/scripts/upgrade_16bit.py
          cat > source/RumiAdventure2/BUILD_16BIT.md <<'EOF'
          Rumi Adventure — 16-bit style build

          The game source is in index.html. Android loads the matching copy from android/app/src/main/assets/index.html.
          The pixel-art update script is scripts/upgrade_16bit.py.
          In GitHub Actions, the workflow runs the script before packaging this ZIP and building the APK.
          To reapply the update from the repository root, run: python3 scripts/upgrade_16bit.py
          EOF
          cd source
          zip -qr ../dist/RumiAdventure-Updated-16bit.zip RumiAdventure2

      - name: Build Android APK
        run: gradle -p source/RumiAdventure2/android assembleDebug

      - name: Save updated source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RumiAdventure-Updated-16bit-Source-ZIP
          path: dist/RumiAdventure-Updated-16bit.zip

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: RumiAdventure-APK
          path: source/RumiAdventure2/android/app/build/outputs/apk/debug/app-debug.apk
